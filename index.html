<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRACED</title>
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="You picked up. Now they know where you are. Make $1,000,000 before they find you." />
    <meta property="og:title" content="TRACED" />
    <meta property="og:description" content="You picked up. Now they know where you are." />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23ddd'%3E%E2%98%8E%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root">
      <div id="stage"></div>

      <!-- first click: browsers will not play sound until you touch the page -->
      <div id="gate" class="typewriter">
        <div class="gate-inner">
          <div class="gate-line">headphones recommended</div>
          <div class="gate-click">click anywhere</div>
        </div>
      </div>

      <div id="prompt" class="typewriter hidden">PICK UP</div>
      <div id="caption" class="typewriter"></div>

      <div id="dialog" class="hidden">
        <div class="dlg-speaker typewriter-lite-bold"></div>
        <div class="dlg-text typewriter"></div>
        <div class="dlg-choices typewriter"></div>
        <div class="dlg-next">&#9660;</div>
      </div>

      <div id="hint" class="typewriter-lite"></div>
      <div id="tip" class="typewriter-lite"></div>
      <div id="toasts"></div>

      <div id="pause" class="hidden typewriter">
        <div class="pause-inner">
          <div class="pause-title">PAUSED</div>
          <label class="pause-row">volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
          <label class="pause-row">VHS filter <input id="vhs" type="range" min="0" max="1.5" step="0.01" value="1" /></label>
          <label class="pause-row"><input id="voice" type="checkbox" checked /> spoken voice</label>
          <div class="pause-btn" data-act="resume">resume</div>
          <div class="pause-help typewriter-lite">
            mouse &mdash; use the laptop &nbsp;&middot;&nbsp; scroll &mdash; lean in / back<br />
            hold right-click &mdash; look around the room &nbsp;&middot;&nbsp; esc &mdash; pause
          </div>
        </div>
      </div>

      <div id="ending" class="hidden">
        <div class="end-lines typewriter"></div>
        <div class="end-stats typewriter-lite"></div>
        <div class="end-btn typewriter hidden">play again</div>
      </div>

      <div id="fade"></div>
    </div>

    <!-- 1:1 with the reference overlays -->
    <div class="vignette"></div>
    <div class="scanlines"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
